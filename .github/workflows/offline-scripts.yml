name: Offline script checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-scripts:
    name: Migration preflight, manifest, checksum and DB TLS tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Node 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Script test suite
        run: node --test scripts/migrate.test.mjs scripts/migrate-preflight.test.mjs scripts/migration-manifest.test.mjs scripts/db-tls.test.mjs scripts/migrate-lock.db.test.mjs scripts/migration-recover.test.mjs
